<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hound — dns monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e0a;
  --fg: #00ff41;
  --dim: #007a1f;
  --amber: #ffb800;
  --red: #ff3e3e;
  --cyan: #00d9ff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  line-height: 1.4;
}

body {
  padding: 24px;
  overflow-x: auto;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 2px,
    rgba(0, 0, 0, 0.18) 3px,
    rgba(0, 0, 0, 0.18) 3px
  );
  pointer-events: none;
  z-index: 100;
}

.frame {
  border: 1px solid var(--fg);
  padding: 16px;
  margin-bottom: 20px;
  position: relative;
}

.frame::before {
  content: attr(data-label);
  position: absolute;
  top: -9px;
  left: 12px;
  background: var(--bg);
  padding: 0 8px;
  font-size: 11px;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 1px;
}

header .title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 2px;
}

header .subtitle {
  color: var(--dim);
  font-size: 12px;
  margin-top: 4px;
}

header .status {
  font-size: 12px;
  color: var(--dim);
  margin-top: 10px;
}

.cursor {
  display: inline-block;
  width: 10px;
  height: 16px;
  background: var(--fg);
  animation: blink 1s infinite steps(1);
  vertical-align: middle;
  margin-left: 6px;
}

@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  font-size: 11px;
  color: var(--dim);
}

.legend .chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 8px;
  border: 1px solid currentColor;
  border-radius: 2px;
}

.legend .chip .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: currentColor;
}

.query {
  padding: 3px 0;
  font-size: 13px;
  white-space: nowrap;
  border-bottom: 1px dashed rgba(0, 122, 31, 0.2);
}

.query:last-child { border-bottom: none; }

.query .ts {
  color: var(--dim);
  margin-right: 12px;
}

.query .ip {
  color: var(--cyan);
  margin-right: 12px;
  display: inline-block;
  min-width: 150px;
}

.query .type {
  color: var(--amber);
  margin-right: 8px;
  display: inline-block;
  min-width: 48px;
}

.query .cat {
  display: inline-block;
  min-width: 90px;
  margin-right: 8px;
  font-size: 11px;
  text-transform: uppercase;
  padding: 1px 6px;
  border: 1px solid currentColor;
  border-radius: 2px;
  text-align: center;
}

.query .domain {
  color: var(--fg);
}

.query.failed .domain {
  color: var(--red);
}

.query.failed::after {
  content: ' [servfail]';
  color: var(--red);
  font-size: 11px;
}

/* devices table */

.devices {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.devices th {
  text-align: left;
  color: var(--dim);
  font-weight: 500;
  padding: 6px 12px 6px 0;
  border-bottom: 1px dashed rgba(0, 122, 31, 0.4);
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 1px;
}

.devices td {
  padding: 6px 12px 6px 0;
  border-bottom: 1px dashed rgba(0, 122, 31, 0.15);
  color: var(--fg);
  vertical-align: middle;
}

.devices tr:last-child td { border-bottom: none; }

.devices .name {
  color: var(--fg);
  font-weight: 500;
}

.devices .ip { color: var(--cyan); }
.devices .ident { color: var(--amber); font-size: 12px; }
.devices .mac { color: var(--dim); font-size: 11px; }
.devices .host { color: var(--amber); font-size: 11px; }
.devices .seen { color: var(--dim); font-size: 11px; }

.devices button.rename {
  background: transparent;
  border: 1px solid var(--dim);
  color: var(--dim);
  padding: 2px 8px;
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
  text-transform: uppercase;
}

.devices button.rename:hover {
  color: var(--fg);
  border-color: var(--fg);
}

.devices input.rename-input {
  background: var(--bg);
  border: 1px solid var(--fg);
  color: var(--fg);
  font-family: inherit;
  font-size: 13px;
  padding: 2px 6px;
  outline: none;
  width: 100%;
}

.empty {
  padding: 20px;
  text-align: center;
  color: var(--dim);
  font-size: 13px;
}

footer {
  margin-top: 24px;
  font-size: 11px;
  color: var(--dim);
  text-align: center;
}

footer a {
  color: var(--cyan);
  text-decoration: none;
}

footer a:hover {
  text-decoration: underline;
}
</style>
</head>
<body>

<div class="frame" data-label="system" role="banner">
  <header>
    <div class="title">> hound<span class="cursor"></span></div>
    <div class="subtitle">retro-terminal dns monitor · v0.1.0</div>
    <div class="status">status: <span id="status">initializing...</span></div>
  </header>
</div>

<div class="frame" data-label="categories">
  <div class="legend" id="legend"></div>
</div>

<div class="frame" data-label="devices">
  <div id="devices">
    <div class="empty">no devices seen yet</div>
  </div>
</div>

<div class="frame" data-label="live · recent dns queries">
  <div id="queries">
    <div class="empty">waiting for traffic...</div>
  </div>
</div>

<footer>
  hound · <a href="https://github.com/AnteurAbderraouf/hound" target="_blank" rel="noopener">github.com/AnteurAbderraouf/hound</a>
</footer>

<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

let CATEGORIES = {};

async function loadCategories() {
  try {
    const res = await fetch('/api/categories');
    CATEGORIES = await res.json();
    const legend = document.getElementById('legend');
    legend.innerHTML = Object.entries(CATEGORIES)
      .sort(([a], [b]) => a.localeCompare(b))
      .map(([name, color]) =>
        `<span class="chip" style="color: ${escapeHtml(color)}"><span class="dot"></span>${escapeHtml(name)}</span>`
      ).join('');
  } catch (err) {
    console.error('failed to load categories', err);
  }
}

function relativeTime(iso) {
  const seconds = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  if (seconds < 5) return 'just now';
  if (seconds < 60) return seconds + 's ago';
  if (seconds < 3600) return Math.round(seconds / 60) + 'm ago';
  if (seconds < 86400) return Math.round(seconds / 3600) + 'h ago';
  return Math.round(seconds / 86400) + 'd ago';
}

async function refreshDevices() {
  const container = document.getElementById('devices');
  try {
    const res = await fetch('/api/devices');
    const data = await res.json();
    if (!data || data.length === 0) {
      container.innerHTML = '<div class="empty">no devices seen yet</div>';
      return;
    }
    const rows = data.map(d => {
      const identity = [d.vendor, d.device_type].filter(Boolean).join(' · ') || '—';
      return `
      <tr data-ip="${escapeHtml(d.ip)}">
        <td class="name" data-role="name">${escapeHtml(d.display_name)}</td>
        <td class="ip">${escapeHtml(d.ip)}</td>
        <td class="ident">${escapeHtml(identity)}</td>
        <td class="mac">${escapeHtml(d.mac || '—')}</td>
        <td class="host">${escapeHtml(d.hostname || '—')}</td>
        <td class="seen" title="${escapeHtml(d.last_seen)}">${relativeTime(d.last_seen)}</td>
        <td><button class="rename" data-ip="${escapeHtml(d.ip)}" data-current="${escapeHtml(d.custom_name || '')}">rename</button></td>
      </tr>`;
    }).join('');
    container.innerHTML = `<table class="devices">
      <thead>
        <tr><th>name</th><th>ip</th><th>identity</th><th>mac</th><th>hostname</th><th>last seen</th><th></th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;

    container.querySelectorAll('button.rename').forEach(btn => {
      btn.addEventListener('click', () => startRename(btn));
    });
  } catch (err) {
    console.error('failed to load devices', err);
  }
}

function startRename(btn) {
  const tr = btn.closest('tr');
  const nameCell = tr.querySelector('[data-role="name"]');
  const ip = btn.getAttribute('data-ip');
  const current = btn.getAttribute('data-current') || nameCell.textContent.trim();

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'rename-input';
  input.value = current;
  input.placeholder = 'new name (empty to clear)';

  nameCell.innerHTML = '';
  nameCell.appendChild(input);
  input.focus();
  input.select();

  const commit = async () => {
    const newName = input.value.trim();
    try {
      const res = await fetch('/api/devices/' + encodeURIComponent(ip), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ custom_name: newName }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      await refreshDevices();
    } catch (err) {
      console.error('rename failed', err);
      nameCell.textContent = current;
    }
  };
  const cancel = () => { nameCell.textContent = current; };

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') commit();
    else if (e.key === 'Escape') cancel();
  });
  input.addEventListener('blur', commit);
}

async function refreshQueries() {
  const statusEl = document.getElementById('status');
  const container = document.getElementById('queries');
  try {
    const res = await fetch('/api/queries?limit=100');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    if (!data || data.length === 0) {
      container.innerHTML = '<div class="empty">no queries yet — configure your router\'s primary DNS to this machine</div>';
      statusEl.textContent = 'online · no traffic yet';
      statusEl.style.color = 'var(--dim)';
      return;
    }

    container.innerHTML = data.map(q => {
      const t = new Date(q.ts);
      const ts = t.toISOString().substr(11, 8);
      const failed = q.responded ? '' : 'failed';
      const cat = q.category || 'other';
      const color = CATEGORIES[cat] || '#6b7280';
      return `<div class="query ${failed}"><span class="ts">${ts}</span><span class="ip">${escapeHtml(q.client_ip)}</span><span class="type">${escapeHtml(q.type)}</span><span class="cat" style="color: ${escapeHtml(color)}">${escapeHtml(cat)}</span><span class="domain">${escapeHtml(q.domain)}</span></div>`;
    }).join('');

    statusEl.textContent = `online · ${data.length} recent queries · ${new Date().toLocaleTimeString()}`;
    statusEl.style.color = 'var(--fg)';
  } catch (err) {
    statusEl.textContent = 'offline · ' + err.message;
    statusEl.style.color = 'var(--red)';
    console.error(err);
  }
}

loadCategories();
refreshDevices();
refreshQueries();
setInterval(refreshQueries, 2000);
setInterval(refreshDevices, 5000);
</script>

</body>
</html>
