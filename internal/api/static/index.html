<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>hound — dns monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e0a;
  --fg: #00ff41;
  --dim: #007a1f;
  --amber: #ffb800;
  --red: #ff3e3e;
  --cyan: #00d9ff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  line-height: 1.4;
}

body {
  padding: 24px;
  overflow-x: auto;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 2px,
    rgba(0, 0, 0, 0.18) 3px,
    rgba(0, 0, 0, 0.18) 3px
  );
  pointer-events: none;
  z-index: 100;
}

.frame {
  border: 1px solid var(--fg);
  padding: 16px;
  margin-bottom: 20px;
  position: relative;
}

.frame::before {
  content: attr(data-label);
  position: absolute;
  top: -9px;
  left: 12px;
  background: var(--bg);
  padding: 0 8px;
  font-size: 11px;
  color: var(--dim);
  text-transform: uppercase;
  letter-spacing: 1px;
}

header .title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 2px;
}

header .subtitle {
  color: var(--dim);
  font-size: 12px;
  margin-top: 4px;
}

header .status {
  font-size: 12px;
  color: var(--dim);
  margin-top: 10px;
}

.cursor {
  display: inline-block;
  width: 10px;
  height: 16px;
  background: var(--fg);
  animation: blink 1s infinite steps(1);
  vertical-align: middle;
  margin-left: 6px;
}

@keyframes blink {
  0%, 49% { opacity: 1; }
  50%, 100% { opacity: 0; }
}

.query {
  padding: 3px 0;
  font-size: 13px;
  white-space: nowrap;
  border-bottom: 1px dashed rgba(0, 122, 31, 0.2);
}

.query:last-child { border-bottom: none; }

.query .ts {
  color: var(--dim);
  margin-right: 12px;
}

.query .ip {
  color: var(--cyan);
  margin-right: 12px;
  display: inline-block;
  min-width: 150px;
}

.query .type {
  color: var(--amber);
  margin-right: 8px;
  display: inline-block;
  min-width: 48px;
}

.query .domain {
  color: var(--fg);
}

.query.failed .domain {
  color: var(--red);
}

.query.failed::after {
  content: ' [servfail]';
  color: var(--red);
  font-size: 11px;
}

.empty {
  padding: 20px;
  text-align: center;
  color: var(--dim);
  font-size: 13px;
}

footer {
  margin-top: 24px;
  font-size: 11px;
  color: var(--dim);
  text-align: center;
}

footer a {
  color: var(--cyan);
  text-decoration: none;
}

footer a:hover {
  text-decoration: underline;
}
</style>
</head>
<body>

<div class="frame" data-label="system" role="banner">
  <header>
    <div class="title">> hound<span class="cursor"></span></div>
    <div class="subtitle">retro-terminal dns monitor · v0.0.3</div>
    <div class="status">status: <span id="status">initializing...</span></div>
  </header>
</div>

<div class="frame" data-label="live · recent dns queries">
  <div id="queries">
    <div class="empty">waiting for traffic...</div>
  </div>
</div>

<footer>
  hound · <a href="https://github.com/AnteurAbderraouf/hound" target="_blank" rel="noopener">github.com/AnteurAbderraouf/hound</a>
</footer>

<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

async function refresh() {
  const statusEl = document.getElementById('status');
  const container = document.getElementById('queries');

  try {
    const res = await fetch('/api/queries?limit=100');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    if (!data || data.length === 0) {
      container.innerHTML = '<div class="empty">no queries yet — configure your router\'s primary DNS to this machine</div>';
      statusEl.textContent = 'online · no traffic yet';
      statusEl.style.color = 'var(--dim)';
      return;
    }

    container.innerHTML = data.map(q => {
      const t = new Date(q.ts);
      const ts = t.toISOString().substr(11, 8);
      const failed = q.responded ? '' : 'failed';
      return `<div class="query ${failed}"><span class="ts">${ts}</span><span class="ip">${escapeHtml(q.client_ip)}</span><span class="type">${escapeHtml(q.type)}</span><span class="domain">${escapeHtml(q.domain)}</span></div>`;
    }).join('');

    statusEl.textContent = `online · ${data.length} recent queries · ${new Date().toLocaleTimeString()}`;
    statusEl.style.color = 'var(--fg)';
  } catch (err) {
    statusEl.textContent = 'offline · ' + err.message;
    statusEl.style.color = 'var(--red)';
    console.error(err);
  }
}

refresh();
setInterval(refresh, 2000);
</script>

</body>
</html>
