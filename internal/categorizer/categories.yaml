# hound category database
# ---------------------------------------------------------------------------
# Each entry declares a category with a color (hex, used by the UI) and a
# list of second-level domains. Matching is done on the full domain and then
# on progressive parent suffixes, so `m.youtube.com` matches `youtube.com`.
#
# Contributing new domains: keep them lowercase, no protocol, no path,
# no leading dot. Prefer the shortest matching suffix (e.g. `google.com`
# rather than `mail.google.com`).
# ---------------------------------------------------------------------------

