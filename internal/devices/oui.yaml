# Curated OUI (Organizationally Unique Identifier) database.
# ---------------------------------------------------------------------------
# Format: first 3 bytes of a MAC address (24 bits, lowercase,
# colon-separated) mapped to the vendor name. Covers the ~80 vendors most
# common on consumer LANs. The full IEEE OUI database has ~35 000 entries;
# a curated subset keeps the binary small while catching >90% of home
# devices in practice.
#
# Contributing: keys must be lowercase, exactly 8 chars, in the form
# "aa:bb:cc". Prefer the shortest official vendor name.
#
# Note on MAC randomization: modern iOS/Android randomize their MAC per
# SSID. The randomized MAC has the "locally administered" bit set (second
# hex char of the first byte is 2, 6, A or E) and does NOT map to a
# manufacturer. Lookup() returns "" for those.
# ---------------------------------------------------------------------------

