# DNS-based device-type fingerprints.
# ---------------------------------------------------------------------------
# Each entry declares a device type, a display label, a match confidence
# (higher wins ties), and a list of "signature domains" that are queried
# almost exclusively by that device family. When hound sees an IP query
# any of those domains, it tags the device with the matching type.
#
# Matching is suffix-based: a signal of `push.apple.com` matches
# `push.apple.com`, `p10-push.apple.com`, or any subdomain.
#
# Contributing new fingerprints:
#   - prefer signals that are highly exclusive (an Apple-only endpoint,
#     not just `apple.com` which every browser hits)
#   - keep confidence values sane; 10 = "impossible to be anything else",
#     1 = "weak hint"
# ---------------------------------------------------------------------------

signatures:

  - type: "iphone"
    label: "iPhone / iPad"
    confidence: 10
    signals:
      - push.apple.com
      - configuration.apple.com
      - gsp10-ssl.ls.apple.com
      - mask.icloud.com
      - mesu.apple.com
      - apps.mzstatic.com

  - type: "mac"
    label: "Mac"
    confidence: 8
    signals:
      - swscan.apple.com
      - swcdn.apple.com
      - swdist.apple.com
      - osrecovery.apple.com

  - type: "android"
    label: "Android"
    confidence: 9
